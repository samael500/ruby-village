<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native contact transition prototype</title><style>body{margin:0;background:#eee6d7;color:#302b26;font:14px system-ui}main{max-width:960px;margin:auto;padding:12px}h1{font-size:18px;margin:4px 0}p{margin:6px 0}canvas{display:block;width:100%;aspect-ratio:768/360;background:#ded2bc;border:1px solid #b5aa95;box-sizing:border-box}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}input[type=range]{flex:1;min-width:180px}pre{white-space:pre-wrap;font-size:12px;line-height:1.35}button,select{font:inherit;padding:5px 9px}@media(max-height:480px){main{padding:4px;max-width:700px}h1{font-size:14px}p{font-size:11px}canvas{width:auto;max-width:100%;height:245px;aspect-ratio:768/360}pre{margin:3px 0;font-size:10px}nav{margin:3px 0}}</style><main><h1>Native Start → Walk → Stop / technical prototype</h1><p>Actual whole3D poses. Static Idle0; sole-weight VARIANT (56 vertices, old Walk sole delta ≤4.484mm). Not final artwork or no-slip certification.</p><canvas id="stage"></canvas><nav><button id="play">Play once</button><button id="replay">Replay reset</button><select id="mode"><option value="fixed">Fixed Root / ground follows d(t)</option><option value="route">Route Root moves once by d(t)</option></select><label><input type="checkbox" id="repeat">Repeat with explicit route reset</label><input id="seek" type="range" min="0" max="79" step="1" value="0"></nav><pre id="state">Loading immutable frames…</pre></main><script type="module">
const manifest=await(await fetch('proof-manifest.json')).json(),c=document.querySelector('#stage'),ctx=c.getContext('2d'),slider=document.querySelector('#seek'),button=document.querySelector('#play'),mode=document.querySelector('#mode'),state=document.querySelector('#state');const images=new Map;await Promise.all([...new Set(manifest.frames.map(f=>f.file))].map(async file=>{const i=new Image;i.src=file;await i.decode();images.set(file,i)}));let frame=0,elapsed=0,playing=false,last=performance.now();const W=768,H=360,Y=16;function draw(){const box=c.getBoundingClientRect(),dpr=devicePixelRatio||1,bw=Math.max(1,Math.round(box.width*dpr)),bh=Math.max(1,Math.round(box.height*dpr));if(c.width!==bw||c.height!==bh){c.width=bw;c.height=bh}ctx.setTransform(bw/W,0,0,bh/H,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.fillStyle='#ded2bc';ctx.fillRect(0,0,W,H);const f=manifest.frames[frame],route=mode.value==='route',base=route?170:384,delta=f.rootProjectedDeltaPx;ctx.strokeStyle='#bfb198';ctx.lineWidth=.7;ctx.beginPath();for(const [a,b]of manifest.groundGridProjectedPx){const sx=base-manifest.rootProjectionOriginPx[0]-(route?0:delta[0]),sy=Y-(route?0:delta[1]);ctx.moveTo(a[0]+sx,a[1]+sy);ctx.lineTo(b[0]+sx,b[1]+sy)}ctx.stroke();ctx.drawImage(images.get(f.file),base-manifest.rootProjectionOriginPx[0]+(route?delta[0]:0),Y+(route?delta[1]:0),256,320);ctx.fillStyle='#554a3b';ctx.fillText(f.segment+' | '+(frame+1)+'/80',12,18);slider.value=frame;state.textContent=`${playing?'PLAY':'PAUSED'} | ${f.segment} | native ${f.action} frame ${f.sourceFrame.toFixed(6)}\nRoot PNG = fixed0; external native XYZ = [${f.rootNativeXYZM.map(x=>x.toFixed(6)).join(', ')}] m; mode=${mode.value}; d applied ${route?'to actor ONCE':'to ground/camera reference ONCE'}\nTime ${(elapsed/1000).toFixed(3)} / ${(manifest.durationMs/1000).toFixed(3)}s | CSS ${box.width.toFixed(1)}×${box.height.toFixed(1)} backing ${bw}×${bh} DPR ${dpr}\nSource pose hash ${f.sourcePoseHash?.slice(0,16)} | Final Idle resets route only on explicit replay.`;window.reviewState={frame,segment:f.segment,action:f.action,sourceFrame:f.sourceFrame,elapsedMs:elapsed,playing,mode:mode.value,root:f.rootNativeXYZM,rootProjectedDeltaPx:delta,backing:[bw,bh],DPR:dpr,sourcePoseHash:f.sourcePoseHash};button.textContent=playing?'Pause':'Play once'}function find(t){let i=0;while(i+1<manifest.frames.length&&manifest.frames[i+1].startMs<=t)i++;return i}window.reviewPause=()=>{playing=false;draw()};window.reviewSeek=i=>{playing=false;frame=Math.max(0,Math.min(79,i));elapsed=manifest.frames[frame].startMs;draw()};window.reviewSetMode=m=>{mode.value=m;draw()};button.onclick=()=>{if(elapsed>=manifest.durationMs){elapsed=0;frame=0}playing=!playing;last=performance.now();draw()};document.querySelector('#replay').onclick=()=>{elapsed=0;frame=0;playing=true;last=performance.now();draw()};slider.oninput=()=>window.reviewSeek(+slider.value);mode.onchange=draw;new ResizeObserver(draw).observe(c);function tick(now){if(playing){elapsed+=Math.min(100,now-last);if(elapsed>=manifest.durationMs){if(document.querySelector('#repeat').checked)elapsed%=manifest.durationMs;else{elapsed=manifest.durationMs;playing=false}}frame=find(elapsed);draw()}last=now;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.reviewReady=true;
