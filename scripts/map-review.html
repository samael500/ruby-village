<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карта первой главы — кандидат для ревью</title><style>
*{box-sizing:border-box}body{margin:0;background:#efe3ca;color:#463322;font:18px Georgia,serif;display:grid;place-items:center;min-height:100vh}.paper{width:min(1320px,98vw);padding:12px;background:#f9f0dc;border:1px solid #bc9c70;border-radius:14px;box-shadow:0 6px 28px #56341730}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:22px;margin:2px 0 8px}p{font:14px system-ui;margin:4px 0 8px}.map{position:relative;aspect-ratio:5/2;overflow:hidden;border-radius:8px}.map>img,.map>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.map>img{object-fit:contain}.node{position:absolute;width:19%;height:36%;transform:translate(-50%,-50%);background:transparent;border:0;border-radius:12px;color:#42301f;cursor:pointer;padding:0}.node:focus-visible{outline:3px solid #744994}.label{position:absolute;left:50%;top:86%;transform:translateX(-50%);white-space:nowrap;background:#fff4d9ec;border:1px solid #bca278;border-radius:6px;padding:3px 7px;font:bold clamp(10px,1.4vw,16px) Georgia}.state{display:block;font:normal .8em system-ui;line-height:1.3}.node:disabled{cursor:default}.node:disabled .label{background:#dfd9cce8;color:#68665c;border-color:#aaa79b}.controls{display:flex;gap:6px}button.mode{font:13px system-ui;padding:7px 10px;background:#fff5de;border:1px solid #ab8e60;border-radius:6px;min-height:44px}.status{min-height:20px}@media(max-height:450px){.paper{padding:4px;width:98vw}header h1{font-size:15px;margin:0}p{font-size:10px;margin:1px}.controls button.mode{font-size:10px;padding:3px;min-height:44px}.map{max-height:calc(100vh - 70px);width:auto;margin:auto;aspect-ratio:5/2}.status{display:none}}
</style><main class="paper"><header><div><h1>За калитку</h1><p>Рисованная карта · кандидат, ещё не принята</p></div><div class="controls"><button class="mode" data-state="new">Начало</button><button class="mode" data-state="partial">Часть дорог</button><button class="mode" data-state="complete">Все дороги</button></div></header><section class="map" aria-label="Карта первой главы"><img src="../assets/chapter-map-v1/chapter-map-candidate.webp" alt="Восемь мест Рубиновой деревни"><svg viewBox="0 0 1000 400" aria-hidden="true"></svg><div class="nodes"></div></section><p class="status" role="status">Восстановлено дорог: 0 из 8</p></main><script>
const points=[[120,95],[365,95],[610,95],[855,95],[855,300],[610,300],[365,300],[120,300]],names=['До калитки','В обход яблони','К колодцу','Тёплая пекарня','Через ручей','К мельнице','Почтовый двор','Тропинка за деревню'];
function render(state){const completed=state==='complete'?8:state==='partial'?4:0;document.querySelector('.nodes').replaceChildren();const svg=document.querySelector('svg');svg.replaceChildren();points.forEach(([x,y],i)=>{if(i>0&&i<completed){const previous=points[i-1],p=document.createElementNS('http://www.w3.org/2000/svg','path');const d=previous[1]===y?(y<200?`M${previous[0]+82} 138 C${previous[0]+105} 175,${x-105} 175,${x-82} 138`:`M${previous[0]-82} 310 C${previous[0]-105} 332,${x+105} 332,${x+82} 310`):`M940 120 C985 170,985 260,940 310`;p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#8560a1');p.setAttribute('stroke-width','5');p.setAttribute('stroke-linecap','round');svg.append(p);}const button=document.createElement('button');button.className='node';button.style.left=`${x/10}%`;button.style.top=`${y/4}%`;button.disabled=i>completed;button.setAttribute('aria-label',`${names[i]}, ${i<completed?'дорога восстановлена':i===completed?'можно отправиться':'пока закрыто'}`);const label=document.createElement('span');label.className='label';label.textContent=`${i+1}. ${names[i]}`;const detail=document.createElement('span');detail.className='state';detail.textContent=i<completed?'Дорога восстановлена':i===completed?'В путь':'Пока закрыто';label.append(detail);button.append(label);button.onclick=()=>document.querySelector('.status').textContent=`Выбрано: ${names[i]}. Это обзорный стенд, пазл не запускается.`;document.querySelector('.nodes').append(button);});document.querySelector('.status').textContent=`Восстановлено дорог: ${completed} из 8`;document.body.dataset.state=state;}
document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>render(button.dataset.state));render('new');
</script></html>
