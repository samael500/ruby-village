<!doctype html><meta charset=utf-8><style>body{background:#dedcd4;color:#302c28;font:16px sans-serif}#views{display:grid;grid-template-columns:repeat(6,180px)}img{width:180px;height:180px}figure{margin:0}strong{color:#713b32}</style><strong>INDEPENDENT TECHNICAL PLAYBACK — REJECTED APPEARANCE / NOT GAME</strong><div id=clock></div><div id=views></div><script>
const groups=['base','calibrated-1'],dirs=['e','se','sw','w','nw','ne'];let data=[],log=[],ready=false,start,held=null;window.hold=f=>held=f;window.resume=()=>{held=null;start=performance.now()};(async()=>{for(let g of groups)for(let d of dirs){let fig=document.createElement('figure'),label=document.createElement('figcaption'),shown=new Image;label.textContent=g+'/'+d;fig.append(label,shown);views.append(fig);let fs=[];for(let f=1;f<=24;f++){let im=new Image;im.src='/art/characters-mpfb-v1/motion/full-cycle-technical/'+g+'/'+d+'/'+String(f).padStart(2,'0')+'.png';await im.decode();fs.push(im)}data.push({shown,fs})}ready=true;start=performance.now();requestAnimationFrame(tick)})();function tick(t){let frame=held??(Math.floor((t-start)/30)%24);for(let row of data)row.shown.src=row.fs[frame].src;clock.textContent='Actual PNG frame '+(frame+1)+' / 30ms ×24 / elapsed '+Math.round(t-start)+'ms';log.push({t,frame});requestAnimationFrame(tick)}
</script>
