<!doctype html><meta charset="utf-8"><title>Ruta delivery RGB comparison</title>
<style>body{background:#e6d3aa;color:#352c22;font:16px sans-serif;margin:12px}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sample{background:linear-gradient(90deg,#d0d7c3 50%,#425b47 50%);border:1px solid #766}canvas{display:block;width:100%}h2{margin:4px;font-size:15px}button{font:inherit}</style>
<h1>Source v2 / WebP94 v3 — identical alpha and geometry</h1><p>Each pair: source left, delivery right. Frames at 2× game display height. <button id="toggle">Animate</button></p><div id="grid"></div>
<script type="module">
const root='/public/assets/characters-walk-v1/';const m=await(await fetch(root+'animated-v2/manifest.json')).json();const views={...m.directions,...Object.fromEntries(Object.entries(m.cameraVariants['calibrated-1'].directions).map(([k,v])=>['calibrated-1-'+k,v]))};const images={};for(const name of Object.keys(m.files)){for(const v of ['animated-v2','animated-v3']){const im=new Image;im.src=root+v+'/'+name;await im.decode();images[v+'/'+name]=im;}}let running=false;document.querySelector('#toggle').onclick=()=>running=!running;const entries=[];for(const[name,v]of Object.entries(views)){const e=document.createElement('div');e.className='sample';e.innerHTML='<h2>'+name+' — original / q94</h2><canvas width="466" height="350"></canvas>';document.querySelector('#grid').append(e);entries.push([e.querySelector('canvas'),v.clips.walk.frames]);}function render(t){let phase=running?Math.floor(t/50)%16:4;for(const[c,frames]of entries){const f=frames[phase],ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const name=f.file.split('/').pop(),[x,y,w,h]=f.sourceRect;ctx.drawImage(images['animated-v2/'+name],x,y,w,h,0,0,233,350);ctx.drawImage(images['animated-v3/'+name],x,y,w,h,233,0,233,350);}window.previewReady=true;requestAnimationFrame(render)}requestAnimationFrame(render);
</script>
