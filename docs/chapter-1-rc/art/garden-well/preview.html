<!doctype html><meta charset="utf-8"><title>Garden/well asset registration bench</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#314331}img{position:absolute;max-width:none}#label{position:fixed;left:8px;bottom:5px;background:#fff9;font:11px sans-serif;color:#263525;z-index:3;padding:3px}</style>
<img id="wide"><img id="resident"><span id="label">Standalone asset registration bench — actual gameplay review separate</span>
<script type="module">
const name=new URLSearchParams(location.search).get('scene')||'garden',base='/public/assets/chapter-1-garden-well/',m=await(await fetch(base+name+'-manifest.json')).json(),actors=await(await fetch('/public/assets/characters-facing-v1/residents-facing-manifest.json')).json(),id=name==='garden'?'rabbit':'teacher',frameName=name==='garden'?'conversation-left':'conversation-front',actor=actors.characters[id],frame=actor.frames[frameName],feet=m.recommendedResidentFeet[id],wide=document.querySelector('#wide'),resident=document.querySelector('#resident');wide.src=base+m.wide.file;resident.src='/public/assets/characters-facing-v1/'+frame.image;await Promise.all([wide.decode(),resident.decode()]);
function fit(){const r=m.wide.originalRect,s=Math.min(innerWidth/r.width,innerHeight/r.height),x=(innerWidth-r.width*s)/2,y=(innerHeight-r.height*s)/2,h=actor.sceneHeightPx,as=h/frame.frameSize[1];Object.assign(wide.style,{left:x-r.x*s+'px',top:y-r.y*s+'px',width:m.wide.canvas.width*s+'px',height:m.wide.canvas.height*s+'px'});Object.assign(resident.style,{left:x+(feet[0]-frame.footAnchor[0]*as)*s+'px',top:y+(feet[1]-frame.footAnchor[1]*as)*s+'px',width:frame.frameSize[0]*as*s+'px',height:h*s+'px'});window.previewFit={s,x,y,feet,frame:frameName,originalRect:r};}
addEventListener('resize',fit);fit();window.previewReady=true;
</script>
