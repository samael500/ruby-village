<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate/bakery — map-match candidate</title><style>*{box-sizing:border-box}body{margin:0;background:#ff00ff;font:14px system-ui;color:#443323}svg{display:block;width:100vw;height:100vh}header{position:fixed;z-index:2;top:5px;left:5px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:5px 10px;background:#fff6dfee;border:1px solid #bba47a;border-radius:8px;max-width:calc(100vw - 10px)}select,button{min-height:44px;border:1px solid #bba47a;background:#fffaf0;color:inherit;border-radius:5px;padding:4px 10px}label{display:flex;align-items:center;gap:4px}small{font-size:11px}@media(max-height:450px){header{font-size:11px;gap:5px;padding:2px 5px}select,button{font-size:11px;padding:3px 5px}small{font-size:9px}}</style><header><strong>Кандидат окружения · не game QA</strong><select id="scene"><option value="gate">Двор</option><option value="bakery">Пекарня</option></select><label><input id="join" type="checkbox" checked>Стык48px</label><label><input id="grid" type="checkbox">Все полигоны</label><label><input id="ruta" type="checkbox" checked>Рута</label><button id="gate">Открыть калитку</button><small id="state"></small></header><svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg><script type="module">
import {fitScene} from '../../../../src/scene-camera.ts';
import {paintedBackdrop,paintedForeground} from '../../../../src/painted-scene.ts';
const root=new URL('../../../../',location.href),ns='http://www.w3.org/2000/svg',svg=document.querySelector('#stage');let open=false;
const manifests={},geometry={};for(const name of ['gate','bakery']){manifests[name]=await fetch(new URL(`assets/chapter-1-map-match/${name}/manifest.json`,root)).then(r=>r.json());geometry[name]=await fetch(new URL(`docs/blender-chapter-1/layouts/engine/${name}.json`,root)).then(r=>r.json());}
const node=(tag,attrs,parent)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));parent.append(e);return e;};
function mask(){const defs=node('defs',{},svg),m=node('mask',{id:'perimeter',maskUnits:'userSpaceOnUse',x:0,y:0,width:1672,height:941},defs),b=48,w=1672,h=941;node('rect',{x:b,y:b,width:w-2*b,height:h-2*b,fill:'white'},m);for(const[side,x1,y1,x2,y2,x,y,width,height]of[['left',0,0,b,0,0,0,b,h],['right',w,0,w-b,0,w-b,0,b,h],['top',0,0,0,b,b,0,w-2*b,b],['bottom',0,h,0,h-b,b,h-b,w-2*b,b]]){const g=node('linearGradient',{id:`edge-${side}`,gradientUnits:'userSpaceOnUse',x1,y1,x2,y2},defs);node('stop',{offset:0,'stop-color':'black'},g);node('stop',{offset:1,'stop-color':'white'},g);node('rect',{x,y,width,height,fill:`url(#edge-${side})`},m);}return'url(#perimeter)';}
async function render(){window.assetReviewReady=false;const name=document.querySelector('#scene').value,m=manifests[name],width=innerWidth,height=innerHeight,scene=fitScene(name,width,height),relative=`../../chapter-1-map-match/${name}/`,assets={background:relative+'background.webp',wide:{...m.wide,file:relative+'wide.webp'},foreground:name==='gate'?'gate/foreground-fixed.webp':null,...(name==='gate'?{gateOpen:'gate/gate-open.webp',gateClosed:'gate/gate-closed.webp'}:{})};svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${width} ${height}`);paintedBackdrop(svg,scene,assets);const world=node('g',{transform:`translate(${scene.offset.x} ${scene.offset.y}) scale(${scene.fit})`},svg);
 if(document.querySelector('#grid').checked){for(const c of geometry[name].cells)node('polygon',{points:c.polygon.map(p=>`${p.x},${p.y}`).join(' '),fill:c.terrain?'#f403':'#00adff18',stroke:c.terrain?'#e44':'#0078ba','stroke-width':1.5},world);for(const label of ['start','goal']){const p=m.anchors[label];node('circle',{cx:p.x,cy:p.y,r:8,fill:label==='start'?'#00d750':'#e35bdd'},world);}}
 if(document.querySelector('#ruta').checked){const p=m.anchors.start,scale=136/970;node('ellipse',{cx:p.x,cy:p.y+3,rx:18,ry:6,fill:'#47321f',opacity:.18},world);node('image',{href:new URL('assets/characters-v1/ruta-idle-pilot.png',root),x:p.x-245*scale,y:p.y-958*scale,width:463*scale,height:970*scale},world);}
 paintedForeground(svg,scene,assets,open);if(document.querySelector('#join').checked){const id=mask();for(const image of svg.querySelectorAll('[data-painted-background],[data-painted-foreground] image'))image.setAttribute('mask',id);}
 const urls=[...svg.querySelectorAll('image')].map(i=>i.getAttribute('href'));await Promise.all(urls.map(url=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=()=>reject(Error(url));im.src=url;})));const r=m.wide.originalRect,c=m.wide.canvas,bounds={left:scene.offset.x-r.x*scene.fit,top:scene.offset.y-r.y*scene.fit,right:scene.offset.x+(c.width-r.x)*scene.fit,bottom:scene.offset.y+(c.height-r.y)*scene.fit};window.assetReviewState={name,width,height,fit:scene.fit,offset:scene.offset,bounds,joinBand:document.querySelector('#join').checked?48:0,open,coreExact:true,scope:'isolated actual painted renderer resource review, not game QA'};document.querySelector('#state').textContent=`${name} · ${width}×${height} · source core exact`;window.assetReviewReady=true;
}
for(const id of ['scene','join','grid','ruta'])document.querySelector('#'+id).onchange=()=>render();document.querySelector('#gate').onclick=()=>{open=!open;document.querySelector('#gate').textContent=open?'Закрыть калитку':'Открыть калитку';render();};addEventListener('resize',render);await render();
</script></html>
